name: Deploy AIHOT Demo (FC + ESA)

# 触发条件：
#   - push 到 main 分支且涉及 server/、web/ 或本文件
#   - 手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "esa.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

concurrency:
  group: aihot-deploy
  cancel-in-progress: false

env:
  FC_REGION: cn-hangzhou
  FC_FUNCTION_NAME: aihot-proxy

jobs:
  # ╔═══════════════════════════════════════════════════════╗
  # ║  Job 1 · 后端 → FC Web 函数                           ║
  # ╚═══════════════════════════════════════════════════════╝
  deploy-backend:
    name: Deploy Backend → FC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Python syntax
        run: |
          python -m py_compile server.py
          python -m py_compile aihot_client.py
          python -m py_compile menu.py
          python -m py_compile config.py
          echo "All Python files passed syntax check."

      - name: Package function code
        run: |
          mkdir -p ../dist/fc-package
          cp server.py aihot_client.py menu.py config.py ../dist/fc-package/
          cp -r fixtures ../dist/fc-package/fixtures
          cd ../dist
          zip -r fc-package.zip fc-package/
          echo "Package size: $(du -sh fc-package.zip | cut -f1)"

      - name: Install Aliyun CLI
        run: |
          curl -sL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun-cli.tgz
          tar -xzf /tmp/aliyun-cli.tgz -C /usr/local/bin
          aliyun version

      - name: Install FC plugin
        run: |
          aliyun plugin install --names aliyun-cli-fc
          aliyun fc --help | head -5

      - name: Configure credentials
        run: |
          aliyun configure set \
            --mode AK \
            --region ${{ env.FC_REGION }} \
            --access-key-id ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}

      - name: Deploy to FC — UpdateFunctionCode
        run: |
          aliyun fc update-function \
            --region ${{ env.FC_REGION }} \
            --functionName ${{ env.FC_FUNCTION_NAME }} \
            --code "{\"zipFile\": \"$(base64 -w0 ../dist/fc-package.zip)\"}"

      - name: Deploy to FC — UpdateFunctionConfiguration
        run: |
          aliyun fc update-function \
            --region ${{ env.FC_REGION }} \
            --functionName ${{ env.FC_FUNCTION_NAME }} \
            --environmentVariables '{
              "AIHOT_UPSTREAM": "${{ vars.AIHOT_UPSTREAM || 'https://aihot.virxact.com' }}",
              "AIHOT_API_PREFIX": "/api/v1",
              "AIHOT_CACHE_TTL": "300",
              "AIHOT_MIN_POLL_INTERVAL": "60",
              "MENU_CACHE_TTL": "3600",
              "PORT": "9000"
            }'

      - name: Backend deployment complete
        run: echo "FC function '${{ env.FC_FUNCTION_NAME }}' deployed successfully."

  # ╔═══════════════════════════════════════════════════════╗
  #   Job 2 · 前端 → ESA Pages（esa-cli）                  ║
  # ╚═══════════════════════════════════════════════════════╝
  deploy-frontend:
    name: Deploy Frontend → ESA Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ESA_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ESA_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static assets
        run: |
          cd web
          test -f index.html || { echo "index.html missing"; exit 1; }
          test -f styles.css || { echo "styles.css missing"; exit 1; }
          test -f app.js     || { echo "app.js missing"; exit 1; }
          echo "Static assets validated."
          du -sh .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ESA CLI
        run: |
          npm i esa-cli@latest -g
          esa-cli -v

      - name: Login to ESA
        run: esa-cli login

      - name: Deploy to ESA Pages
        run: |
          esa-cli deploy \
            --name steven-ai-hot-information \
            --assets ./web
          echo "ESA Pages deployed successfully."

      - name: Frontend deployment complete
        run: echo "ESA Pages project 'steven-ai-hot-information' deployed."

  # ╔═══════════════════════════════════════════════════════╗
  # ║  Job 3 · 部署汇总                                     ║
  # ╚═══════════════════════════════════════════════════════╝
  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## AIHOT Demo Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | FC Web Function | ${{ needs.deploy-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ESA Pages | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
